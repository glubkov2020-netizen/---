<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реквизиты организации</title>
    <style>
        :root {
            --bg: #F7F5F2;
            --bg-accent1: #EAF2EF;
            --bg-accent2: #F3EDE6;
            --text: #2D3E40;
            --heading: #1F3A3D;
            --muted: #5C6B6E;
            --accent: #7BA8A0;
            --accent-soft: #D6E6E1;
            --card: rgba(255, 255, 255, 0.72);
            --card-border: #E3DED7;
            --radius: 16px;
            --shadow: 0 10px 30px -18px rgba(31, 58, 61, 0.35);
        }

        * { box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

        body {
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            max-width: 760px;
            margin: 0 auto;
            padding: 32px 24px 56px;
            color: var(--text);
            line-height: 1.7;
            background:
                radial-gradient(1200px 600px at 100% -10%, var(--bg-accent1), transparent 60%),
                radial-gradient(900px 500px at -10% 110%, var(--bg-accent2), transparent 55%),
                var(--bg);
            background-attachment: fixed;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            animation: pageIn 0.7s ease both;
        }

        @keyframes pageIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 26px;
            color: var(--heading);
            margin: 0 0 20px;
            line-height: 1.3;
            position: relative;
            padding-bottom: 14px;
            letter-spacing: -0.01em;
        }

        h1::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            height: 3px;
            width: 64px;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--accent), var(--accent-soft));
            background-size: 200% 100%;
            animation: shimmer 4s linear infinite;
        }

        @keyframes shimmer {
            0%   { background-position: 0% 0; }
            100% { background-position: 200% 0; }
        }

        h2 {
            font-size: 18px;
            color: var(--heading);
            margin: 28px 0 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h2::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 0 rgba(123, 168, 160, 0.5);
            animation: pulse 2.4s ease-out infinite;
            flex: 0 0 auto;
        }

        @keyframes pulse {
            0%   { box-shadow: 0 0 0 0 rgba(123, 168, 160, 0.5); }
            70%  { box-shadow: 0 0 0 10px rgba(123, 168, 160, 0); }
            100% { box-shadow: 0 0 0 0 rgba(123, 168, 160, 0); }
        }

        p, li { font-size: 15px; }

        p { margin: 0 0 10px; }

        .note {
            position: relative;
            background: var(--card);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 16px 16px 16px 44px;
            font-size: 14px;
            color: var(--muted);
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: transform 0.35s ease, box-shadow 0.35s ease;
            animation: rise 0.6s 0.1s ease both;
        }

        .note::before {
            content: "";
            position: absolute;
            left: 18px;
            top: 22px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 0 rgba(123, 168, 160, 0.55);
            animation: pulse 2.4s ease-out infinite;
        }

        .note:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 40px -22px rgba(31, 58, 61, 0.45);
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
            background: var(--card);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            animation: rise 0.6s 0.25s ease both;
        }

        tr { transition: background-color 0.25s ease; }
        tr:hover { background: rgba(123, 168, 160, 0.08); }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--card-border);
            font-size: 15px;
            transition: color 0.25s ease;
        }

        tr:last-child td { border-bottom: none; }

        td:first-child {
            font-weight: 600;
            width: 40%;
            color: var(--heading);
        }

        @media (max-width: 520px) {
            body { padding: 24px 18px 48px; }
            h1 { font-size: 22px; }
            h2 { font-size: 16px; margin-top: 24px; }
            p, li { font-size: 14.5px; }
            .note { padding: 14px 14px 14px 40px; font-size: 13.5px; }
            .note::before { left: 16px; top: 20px; }
            td { padding: 12px 12px; font-size: 14px; }
            td:first-child { width: 44%; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <h1>Реквизиты организации</h1>
    <p class="note">Поля заполняются заказчицей после консультации с юристом. Сейчас — плейсхолдеры.</p>
    <table>
        <tr><td>Наименование</td><td>ИП / ООО «…»</td></tr>
        <tr><td>ИНН</td><td>—</td></tr>
        <tr><td>ОГРН / ОГРНИП</td><td>—</td></tr>
        <tr><td>Юридический адрес</td><td>—</td></tr>
        <tr><td>Контактный e-mail</td><td>hello@example.com</td></tr>
        <tr><td>Телефон</td><td>—</td></tr>
    </table>
</body>
</html>
